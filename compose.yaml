name: owrt-remote
services:
  hub:
    build:
      context: .
      dockerfile: docker/hub/Dockerfile
    image: owrt-remote-hub:local
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      OWRT_REMOTE_BIND: "127.0.0.1"
      OWRT_REMOTE_PORT: "${HUB_PORT:-8088}"
      OWRT_REMOTE_STATE_DIR: /var/lib/owrt-remote
      OWRT_REMOTE_XRAY_CONFIG: /etc/xray/owrt-remote.json
      OWRT_REMOTE_VLESS_PORT: "${XRAY_PORT:-18443}"
      OWRT_REMOTE_PUBLIC_URL: "${PUBLIC_URL:-}"
      OWRT_REMOTE_XRAY_SERVICE: owrt-remote-xray
    volumes:
      - ./data/state:/var/lib/owrt-remote
      - ./data/xray:/etc/xray
      - ./data/control:/run/owrt-control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
  xray:
    build:
      context: .
      dockerfile: docker/xray/Dockerfile
    image: owrt-remote-xray:local
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      XRAY_CONFIG: /etc/xray/owrt-remote.json
      CONTROL_DIR: /run/owrt-control
    volumes:
      - ./data/xray:/etc/xray:ro
      - ./data/control:/run/owrt-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(int(open('/run/owrt-control/xray.pid').read()),0)"]
      interval: 30s
      timeout: 5s
      retries: 3
