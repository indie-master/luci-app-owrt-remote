name: owrt-remote
services:
  hub:
    build:
      context: .
      dockerfile: docker/hub/Dockerfile
    image: owrt-remote-hub:docker-edition
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      OWRT_REMOTE_BIND: "127.0.0.1"
      OWRT_REMOTE_PORT: "${HUB_PORT:-8088}"
      OWRT_REMOTE_STATE_DIR: /var/lib/owrt-remote
      OWRT_REMOTE_DB: /var/lib/owrt-remote/hub.db
      OWRT_REMOTE_XRAY_CONFIG: /etc/xray/owrt-remote.json
      OWRT_REMOTE_VLESS_PORT: "${XRAY_PORT:-18443}"
      OWRT_REMOTE_PUBLIC_URL: "${PUBLIC_URL:-}"
      OWRT_REMOTE_RESTART_XRAY_ON_WAN_RECONNECT: "0"
      OWRT_CONTROL_SOCKET: /run/owrt-control/xray.sock
    volumes:
      - ./data/state:/var/lib/owrt-remote
      - ./data/xray:/etc/xray
      - ./data/control:/run/owrt-control
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('OWRT_REMOTE_PORT','8088')+'/health',timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
  xray:
    build:
      context: .
      dockerfile: docker/xray/Dockerfile
    image: owrt-remote-xray:docker-edition
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      XRAY_CONFIG: /etc/xray/owrt-remote.json
      CONTROL_DIR: /run/owrt-control
    volumes:
      - ./data/xray:/etc/xray
      - ./data/control:/run/owrt-control
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,socket; s=socket.socket(socket.AF_UNIX);s.settimeout(3);s.connect('/run/owrt-control/xray.sock');s.sendall(bytes.fromhex('7b22616374696f6e223a22737461747573227d0a'));response=s.recv(2048);assert json.loads(response)['ok']"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
