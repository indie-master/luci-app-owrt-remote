name: Router Orchestrator unified Docker checks

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'deploy/**'
      - 'vps/**'
      - 'tests/**'
      - 'files/usr/lib/owrt-remote/logs.sh'
      - 'files/usr/sbin/owrt-remote'
      - '.github/workflows/transport-profiles.yml'
  push:
    branches:
      - 'feature/router-orchestrator-unified-docker-transports-20261123'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check production modules
        run: |
          python -m py_compile vps/owrt-remote-hub.py docker/host_adapter.py docker/transport_profiles.py docker/transport_canary.py docker/xray_lifecycle.py docker/xray_releases.py docker/core_job_runner.py deploy/prepare_belt.py deploy/apply_belt.py deploy/refresh_belt_candidate.py docker/xray_watchdog.py docker/transport_stage.py docker/transport_stage_job.py docker/cleanup.py
          python -m py_compile tests/test_transport_profiles.py
      - name: Pure transport tests
        run: |
          python -m unittest discover -s tests -p 'test_transport_profiles.py' -v
          python -m unittest discover -s tests -p 'test_transport_canary.py' -v
          python -m unittest discover -s tests -p 'test_transport_stage_recovery.py' -v
          python -m unittest discover -s tests -p 'test_openwrt_transport_pilot.py' -v
          python -m unittest discover -s tests -p 'test_ssh_command_quoting.py' -v
          python -m unittest discover -s tests -p 'test_web_ui_javascript.py' -v
          python -m unittest discover -s tests -p 'test_xray_core_manager.py' -v
      - name: Global Logs persistence and delivery regression
        run: |
          python -m unittest discover -s tests -p 'test_global_logs.py' -v
          python -m unittest discover -s tests -p 'test_router_log_transport.py' -v
      - name: Validate OpenWrt transport client POSIX shell
        run: |
          sh -n files/usr/sbin/owrt-remote
          grep -Fq 'transport-preflight)' files/usr/sbin/owrt-remote
          grep -Fq 'vps_transport" in tcp|ws|reality-tcp|xhttp|grpc)' files/usr/sbin/owrt-remote
      - name: Validate systemd worker and watchdog units
        run: |
          systemd-analyze verify deploy/systemd/router-orchestrator-host-adapter.service deploy/systemd/router-orchestrator-core-job@.service deploy/systemd/router-orchestrator-xray-watchdog.service deploy/systemd/router-orchestrator-xray-watchdog.timer deploy/systemd/router-orchestrator-transport-expiry.service deploy/systemd/router-orchestrator-transport-expiry.timer deploy/systemd/router-orchestrator-transport-stage@.service deploy/systemd/router-orchestrator-transport-rollback.service
      - name: Validate embedded nginx configuration
        run: |
          docker run --rm -v "$PWD/deploy/nginx/embedded.conf:/etc/nginx/nginx.conf:ro" nginx:1.29-alpine nginx -t
      - name: Validate embedded TLS stream nginx syntax
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout privkey.pem -out fullchain.pem -days 1 -nodes -subj '/CN=router.example.org' >/dev/null 2>&1
          mkdir -p /tmp/ro-test-tls
          cp fullchain.pem privkey.pem /tmp/ro-test-tls/
          docker run --rm -v "$PWD/deploy/nginx/embedded-stream-tls.conf:/etc/nginx/nginx.conf:ro" -v "/tmp/ro-test-tls:/etc/router-orchestrator/tls:ro" nginx:1.29-alpine nginx -t
      - name: Validate consolidated Compose
        env:
          RO_HUB_IMAGE: router-orchestrator-hub:test
          RO_XRAY_IMAGE: router-orchestrator-xray:26.3.27-test
          RO_PUBLIC_URL: https://router.example.org
          RO_STATE_DIR: /tmp/router-orchestrator-state
          RO_TERMINAL_KEY_PATH: /tmp/router-orchestrator-key
          RO_TERMINAL_KNOWN_HOSTS: /tmp/router-orchestrator-known
          RO_NGINX_CONF: /tmp/router-orchestrator-nginx.conf
          RO_TLS_DIR: /tmp/router-orchestrator-tls
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          test "$(docker compose -f deploy/docker-compose.yml config --services | sort | tr '\n' ' ')" = "hub nginx xray "
      - name: Build portable HUB image
        run: |
          SHA=$(sha256sum vps/owrt-remote-hub.py | awk '{print $1}')
          docker build --file docker/hub/Dockerfile --build-arg HUB_SOURCE_SHA256="$SHA" -t router-orchestrator-hub:ci .
      - name: Validate WoL helper in image
        run: |
          test "$(docker run --rm --entrypoint /opt/owrt-remote/bin/askpass.sh -e OWRT_REMOTE_SSH_PASSWORD=TEST_TOKEN_ONLY router-orchestrator-hub:ci)" = TEST_TOKEN_ONLY
