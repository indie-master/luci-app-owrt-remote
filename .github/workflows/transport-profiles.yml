name: Router transport profiles

on:
  pull_request:
    paths:
      - 'docker/transport_profiles.py'
      - 'tests/test_transport_profiles.py'
      - '.github/workflows/transport-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test pure renderer
        run: |
          python -m py_compile docker/transport_profiles.py tests/test_transport_profiles.py
          python -m unittest discover -s tests -p 'test_transport_profiles.py' -v
