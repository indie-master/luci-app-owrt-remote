name: Docker transaction integration
on:
  pull_request:
    paths:
      - '.github/workflows/docker-integration.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'tools/orchestrator_stack_config.py'
      - 'tools/orchestrator_edge_plan.py'
      - 'vps/**'
      - 'tests/docker_integration_ci.py'
      - 'tests/test_docker_backup_recovery.py'
      - 'tests/test_orchestrator_stack_config.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
      RO_CI_COMPOSE_VERSION: v2.39.4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned Docker Compose plugin for this job
        run: |
          set -euo pipefail
          config="$(mktemp -d "$RUNNER_TEMP/ro-ci-docker.XXXXXXXX")"
          asset=docker-compose-linux-x86_64
          release="https://github.com/docker/compose/releases/download/$RO_CI_COMPOSE_VERSION"
          test "$(uname -m)" = x86_64
          cd "$config"
          curl --proto '=https' -fsSL "$release/$asset" -o "$asset"
          curl --proto '=https' -fsSL "$release/checksums.txt" -o checksums.txt
          awk -v asset="$asset" '$2 == asset || $2 == "*" asset {print $1 "  " asset; found++} END {exit found != 1}' \
            checksums.txt > compose.sha256
          sha256sum --strict --check compose.sha256
          install -D -m 0755 "$asset" cli-plugins/docker-compose
          installed="$(DOCKER_CONFIG="$config" docker compose version --short)"
          test "${installed#v}" = "${RO_CI_COMPOSE_VERSION#v}"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Offline fault and configuration regressions
        run: |
          python3 -m unittest discover -s tests -p test_docker_backup_recovery.py
          python3 -m unittest discover -s tests -p test_orchestrator_stack_config.py
      - name: Real clean install, restart, backup, restore, update and recovery
        run: |
          sudo env -i HOME=/root PATH="$PATH" DOCKER_CONFIG="$DOCKER_CONFIG" \
            PYTHONDONTWRITEBYTECODE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            python3 tests/docker_integration_ci.py
