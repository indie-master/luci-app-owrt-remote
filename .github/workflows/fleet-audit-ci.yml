name: Remote HUB fleet audit tests

on:
  push:
    branches: [feature/indie-branding]
    paths:
      - "vps/owrt-remote-hub.py"
      - "tests/test_orchestrator_setup_profiles.py"
      - "tools/orchestrator_setup_profiles.py"
      - "tools/orchestrator_profile_catalog.py"
      - "tools/orchestrator_belt_docker_migration_gate.py"
      - "tools/orchestrator_docker_rehearsal_restore.py"
      - "tests/test_orchestrator_docker_rehearsal_restore.py"
      - "tests/test_orchestrator_belt_docker_migration_gate.py"
      - "tests/test_orchestrator_profile_catalog.py"
      - "tools/orchestrator_edge_plan.py"
      - "vps/static/orchestrator-setup-preview.html"
      - "tests/test_orchestrator_setup_wizard_ui.py"
      - "tests/test_orchestrator_edge_plan.py"
      - "tools/orchestrator_xray_core_stage.py"
      - "tests/test_orchestrator_xray_core_stage.py"

      - "tests/test_wss_transport.py"
      - "tools/belt_new_wss_enroll.py"
      - "tools/belt_hub_host_export_hotfix.py"
      - "tests/test_belt_hub_host_export_hotfix.py"
      - "tests/test_belt_new_wss_enroll.py"
      - "tools/belt_fleet_config_audit.py"
      - "tools/belt_wss_db_reconcile_stage.py"
      - "tools/belt_wss_db_reconcile_apply.py"
      - "tests/test_belt_fleet_config_audit.py"
      - "tests/test_belt_wss_db_reconcile_stage.py"
      - "tests/test_belt_wss_db_reconcile_apply.py"
      - ".github/workflows/fleet-audit-ci.yml"
  pull_request:
    paths:
      - "vps/owrt-remote-hub.py"
      - "tests/test_wss_transport.py"
      - "tools/belt_new_wss_enroll.py"
      - "tests/test_belt_new_wss_enroll.py"
      - "tools/belt_fleet_config_audit.py"
      - "tests/test_belt_fleet_config_audit.py"
      - ".github/workflows/fleet-audit-ci.yml"

permissions:
  contents: read

jobs:
  unit:
    name: SQLite / Xray parity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline first-run setup and dual-sided WSS/REALITY profile regression
        run: |
          python3 -m py_compile tools/orchestrator_setup_profiles.py
          python3 -m unittest discover -s tests -p 'test_orchestrator_setup_profiles.py' -v
      - name: Validate pinned Xray core candidate gate (no deploy)
        run: |
          python3 -m py_compile tools/orchestrator_xray_core_stage.py
          python3 -m unittest discover -s tests -p 'test_orchestrator_xray_core_stage.py' -v
      - name: Verify two safe Docker edge plans and TLS ownership
        run: |
          python3 -m py_compile tools/orchestrator_edge_plan.py
          python3 -m unittest discover -s tests -p 'test_orchestrator_edge_plan.py' -v
      - name: Check per-router alternate profile selection and end-to-end failover gates
        run: |
          python3 -m py_compile tools/orchestrator_profile_catalog.py
          python3 -m unittest discover -s tests -p 'test_orchestrator_profile_catalog.py' -v
      - name: Execute local first-run wizard and validate its produced schemas
        run: python3 -m unittest discover -s tests -p 'test_orchestrator_setup_wizard_ui.py' -v
      - name: Preserve complete Belt SQLite, history and Xray parity during Docker migration
        run: |
          python3 -m py_compile tools/orchestrator_belt_docker_migration_gate.py
          python3 -m unittest discover -s tests -p 'test_orchestrator_belt_docker_migration_gate.py' -v
      - name: Full private Docker shadow restore and history continuity
        run: |
          python3 -m py_compile tools/orchestrator_docker_rehearsal_restore.py
          python3 -m unittest discover -s tests -p 'test_orchestrator_docker_rehearsal_restore.py' -v
      - name: Test OpenWrt WSS export hostname normalization
        run: |
          python3 -m py_compile vps/owrt-remote-hub.py
          python3 -m unittest discover -s tests -p 'test_wss_transport.py' -v
      - name: Test safe new WSS router enrollment on synthetic fleet
        run: |
          python3 -m py_compile tools/belt_new_wss_enroll.py
          python3 -m unittest discover -s tests -p 'test_belt_new_wss_enroll.py' -v
      - name: Test source-only Belt Hub host export hotfix
        run: |
          python3 -m py_compile tools/belt_hub_host_export_hotfix.py
          python3 -m unittest discover -s tests -p 'test_belt_hub_host_export_hotfix.py' -v
      - name: Compile audit
        run: python3 -m py_compile tools/belt_fleet_config_audit.py tools/belt_wss_db_reconcile_stage.py tools/belt_wss_db_reconcile_apply.py
      - name: Test synthetic inventory
        run: |
          python3 -m unittest discover -s tests -p 'test_belt_fleet_config_audit.py' -v
          sudo python3 -m unittest discover -s tests -p 'test_belt_wss_db_reconcile_stage.py' -v
          python3 -m unittest discover -s tests -p 'test_belt_wss_db_reconcile_apply.py' -v
