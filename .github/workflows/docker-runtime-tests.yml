name: Docker runtime static & offline tests
on:
  push:
    branches: [feature/router-orchestrator-docker-runtime]
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'vps/owrt-remote-hub.py'
      - 'tests/test_orchestrator_docker_runtime.py'
      - 'tests/test_orchestrator_host_adapter_readonly.py'
      - 'tests/test_orchestrator_host_adapter_acceptance.py'
      - 'tools/orchestrator_host_adapter_readonly_acceptance.py'
      - 'tools/orchestrator_host_adapter_xray_dryrun.py'
      - 'tools/orchestrator_host_adapter_readonly_upgrade.sh'
      - 'tests/test_orchestrator_xray_dryrun.py'
      - 'tools/orchestrator_docker_wss_enrollment_preview.py'
      - 'tests/test_orchestrator_belt_rehearsal.py'
      - 'tools/orchestrator_belt_rehearsal.py'
      - 'tests/test_orchestrator_docker_candidate_rehearsal.py'
      - 'tools/orchestrator_docker_candidate_rehearsal.py'
      - 'tools/orchestrator_docker_wss_enrollment_preview.py'
      - 'tests/test_orchestrator_wss_preview.py'
      - 'tests/test_wss_transport.py'
      - 'tools/orchestrator_wss_commit_pilot.py'
      - 'tests/test_orchestrator_wss_commit_pilot.py'
      - 'tools/orchestrator_belt_cutover.py'
      - 'tests/test_orchestrator_belt_cutover.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile source files
        run: python -m py_compile docker/manager.py docker/host_adapter.py vps/owrt-remote-hub.py tools/orchestrator_belt_rehearsal.py tools/orchestrator_docker_candidate_rehearsal.py tools/orchestrator_belt_cutover.py tools/orchestrator_docker_wss_enrollment_preview.py tools/orchestrator_host_adapter_readonly_acceptance.py tools/orchestrator_host_adapter_xray_dryrun.py tools/orchestrator_wss_commit_pilot.py
      - name: Host adapter systemd unit syntax
        run: systemd-analyze verify docker/host_adapter.service
      - name: Shell syntax
        run: |
          sh -n docker/install.sh
          bash -n tools/orchestrator_host_adapter_readonly_install.sh
          bash -n tools/orchestrator_host_adapter_readonly_upgrade.sh
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_orchestrator_docker_runtime.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_host_adapter_readonly.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_host_adapter_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_xray_dryrun.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_belt_rehearsal.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_docker_candidate_rehearsal.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_belt_cutover.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_wss_preview.py' -v
          python -m unittest discover -s tests -p 'test_wss_transport.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator_wss_commit_pilot.py' -v
      - name: Validate compose model
        run: |
          cp .env.example .env
          docker compose config --quiet
