name: Unified Docker stack integration
on:
  pull_request:
    paths:
      - '.github/workflows/docker-stack-integration.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'deploy/systemd/router-orchestrator-xray-watchdog.*'
      - 'docker-compose.yml'
      - 'files/usr/sbin/owrt-remote'
      - 'tools/orchestrator_stack_config.py'
      - 'tools/orchestrator_edge_plan.py'
      - 'tools/orchestrator_setup_profiles.py'
      - 'tools/rehearse_secure_reverse.py'
      - 'tests/docker_stack_integration_ci.py'
      - 'tests/test_docker_stack_runtime.py'
      - 'tests/test_docker_backup_recovery.py'
      - 'tests/test_unified_xray_adapter.py'
      - 'tests/test_unified_core_manager.py'
      - 'tests/test_openwrt_transport_pilot.py'
      - 'tests/openwrt_transport_lifecycle_fixture.sh'
      - 'vps/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, external-stream, external-only]
        backend: [external_readonly, unified_adapter]
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
      RO_CI_COMPOSE_VERSION: v2.39.4
      RO_CI_XRAY_VERSION: '26.10.21'
      RO_CI_CORE_CANDIDATE_VERSION: '26.10.31'
      RO_CI_CORE_CANDIDATE_DIGEST: 'sha256:db94b52238af7311f30044a1ef64e77b0edf285a302c276a7f4d7b368e6a17ab'
      RO_CI_NGINX_VERSION: '1.29.3'
      # Official upstream Linux amd64 manifest digests; pinned for reproducible CI.
      RO_CI_XRAY_DIGEST: 'sha256:447ffc750a0b87d6e4f2c38425f68105bfc8c789e59c22d83b94eb7e1e648c50'
      RO_CI_NGINX_DIGEST: 'sha256:667473807103639a0aca5b49534a216d2b64f0fb868aaa801f023da0cdd781c7'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline stack regressions
        run: |
          python3 -m unittest discover -s tests -p test_docker_stack_runtime.py
          python3 -m unittest discover -s tests -p test_orchestrator_stack_config.py
          python3 -m unittest discover -s tests -p test_docker_backup_recovery.py
          python3 -m unittest discover -s tests -p test_openwrt_transport_pilot.py
          sh -n tests/openwrt_transport_lifecycle_fixture.sh
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_unified_xray_adapter.py
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_unified_core_manager.py
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_stack_host_install.py
      - name: Verify pinned Docker Compose plugin
        run: |
          set -euo pipefail
          config="$(mktemp -d "$RUNNER_TEMP/ro-stack-docker.XXXXXXXX")"
          asset=docker-compose-linux-x86_64
          release="https://github.com/docker/compose/releases/download/$RO_CI_COMPOSE_VERSION"
          test "$(uname -m)" = x86_64
          cd "$config"
          curl --proto '=https' -fsSL "$release/$asset" -o "$asset"
          curl --proto '=https' -fsSL "$release/checksums.txt" -o checksums.txt
          awk -v asset="$asset" '$2 == asset || $2 == "*" asset {print $1 "  " asset; found++} END {exit found != 1}' \
            checksums.txt > compose.sha256
          sha256sum --strict --check compose.sha256
          install -D -m 0755 "$asset" cli-plugins/docker-compose
          installed="$(DOCKER_CONFIG="$config" docker compose version --short)"
          test "${installed#v}" = "${RO_CI_COMPOSE_VERSION#v}"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Pull official images by reviewed digest and verify versions
        env:
          RO_CI_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          for digest in "$RO_CI_XRAY_DIGEST" "$RO_CI_NGINX_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::A reviewed upstream image digest is missing or invalid."
              exit 1
            fi
          done
          if [[ "$RO_CI_BACKEND" = unified_adapter ]]; then
            if [[ ! "$RO_CI_CORE_CANDIDATE_VERSION" =~ ^[0-9]{1,4}\.[0-9]{1,3}\.[0-9]{1,3}$ ||
                  ! "$RO_CI_CORE_CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ||
                  "$RO_CI_CORE_CANDIDATE_DIGEST" = "$RO_CI_XRAY_DIGEST" ||
                  "$RO_CI_CORE_CANDIDATE_VERSION" = "$RO_CI_XRAY_VERSION" ]]; then
              echo "::error::Core acceptance blocked. The pinned second official Xray Linux amd64 release is invalid."
              exit 1
            fi
          fi
          xray="ghcr.io/xtls/xray-core@$RO_CI_XRAY_DIGEST"
          nginx="nginx@$RO_CI_NGINX_DIGEST"
          docker pull --platform linux/amd64 "$xray"
          docker pull --platform linux/amd64 "$nginx"
          xray_version="$(docker run --pull=never --network=none --rm "$xray" version)"
          read -r product version _ <<< "$xray_version"
          test "$product" = Xray
          test "$version" = "$RO_CI_XRAY_VERSION"
          nginx_version="$(docker run --pull=never --network=none --rm --entrypoint nginx "$nginx" -v 2>&1)"
          test "$nginx_version" = "nginx version: nginx/$RO_CI_NGINX_VERSION"
          echo "RO_CI_XRAY_IMAGE=$xray" >> "$GITHUB_ENV"
          echo "RO_CI_NGINX_IMAGE=$nginx" >> "$GITHUB_ENV"
          if [[ "$RO_CI_BACKEND" = unified_adapter ]]; then
            candidate="ghcr.io/xtls/xray-core@$RO_CI_CORE_CANDIDATE_DIGEST"
            docker pull --platform linux/amd64 "$candidate"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate")" = linux/amd64
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$candidate" |
              grep -Fx -- "$candidate"
            output="$(docker run --pull=never --network=none --rm "$candidate" version)"
            read -r product version _ <<< "$output"
            test "$product" = Xray
            test "$version" = "$RO_CI_CORE_CANDIDATE_VERSION"
            echo "RO_CI_CORE_CANDIDATE_IMAGE=$candidate" >> "$GITHUB_ENV"
          fi
      - name: Run the real stack and isolated ingress fixture
        env:
          RO_CI_MODE: ${{ matrix.mode }}
          RO_CI_BACKEND: ${{ matrix.backend }}
        run: |
          sudo env -i HOME=/root PATH="$PATH" DOCKER_CONFIG="$DOCKER_CONFIG" \
            PYTHONDONTWRITEBYTECODE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            RO_CI_XRAY_IMAGE="$RO_CI_XRAY_IMAGE" RO_CI_NGINX_IMAGE="$RO_CI_NGINX_IMAGE" \
            RO_CI_BACKEND="$RO_CI_BACKEND" RO_CI_XRAY_VERSION="$RO_CI_XRAY_VERSION" \
            RO_CI_CORE_CANDIDATE_IMAGE="${RO_CI_CORE_CANDIDATE_IMAGE:-}" \
            RO_CI_CORE_CANDIDATE_VERSION="$RO_CI_CORE_CANDIDATE_VERSION" \
            python3 tests/docker_stack_integration_ci.py "$RO_CI_MODE"
