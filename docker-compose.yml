name: router-orchestrator
services:
  hub:
    image: ${RO_HUB_RUNTIME_IMAGE:-${RO_IMAGE:?Set RO_IMAGE in .env}}
    container_name: ${RO_STACK_NAME:-router-orchestrator}-hub
    network_mode: host
    restart: unless-stopped
    user: "23088:23088"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    environment:
      OWRT_REMOTE_STATE_DIR: /var/lib/owrt-remote
      OWRT_REMOTE_BIND: "127.0.0.1"
      OWRT_REMOTE_PORT: "${RO_PORT:?Set RO_PORT in .env}"
      OWRT_REMOTE_PUBLIC_URL: "${RO_PUBLIC_URL:-}"
      OWRT_REMOTE_XRAY_CONTROL_BACKEND: "${RO_XRAY_BACKEND:-external_readonly}"
      OWRT_REMOTE_RUNTIME: docker
      OWRT_REMOTE_APP_NAME: "Router Orchestrator"
      OWRT_REMOTE_RESTART_XRAY_ON_WAN_RECONNECT: "0"
    volumes:
      - type: bind
        source: ${RO_STATE_DIR:?Set RO_STATE_DIR in .env}
        target: /var/lib/owrt-remote
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /run:rw,nosuid,nodev,size=8m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; p=os.environ['OWRT_REMOTE_PORT']; d=json.load(urllib.request.urlopen('http://127.0.0.1:'+p+'/health',timeout=3)); assert d.get('ok') is True"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  xray:
    profiles: [standalone, external-stream, external-only]
    image: ${RO_XRAY_IMAGE:-router-orchestrator-xray:unconfigured}
    pull_policy: never
    container_name: ${RO_STACK_NAME:-router-orchestrator}-xray
    labels:
      org.router-orchestrator.stack-owner: "${RO_STACK_OWNER:-}"
      org.router-orchestrator.stack-revision: "${RO_STACK_REVISION:-}"
    network_mode: host
    restart: unless-stopped
    user: "23088:23088"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    environment:
      XRAY_LOCATION_ASSET: /usr/local/share/xray
    command: ["run", "-config", "/etc/xray/owrt-remote.json"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
      # Override the official image's declared volumes; never create anonymous
      # persistent mounts for its unused default config or log directory.
      - /usr/local/etc/xray:ro,nosuid,nodev,noexec,size=1m
      - /var/log/xray:rw,nosuid,nodev,noexec,size=32m,uid=23088,gid=23088,mode=0700
    volumes:
      - type: bind
        source: ${RO_XRAY_CONFIG_DIR:-./.unconfigured-xray}
        target: /etc/xray
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RO_XRAY_ASSET_DIR:-./.unconfigured-assets}
        target: /usr/local/share/xray
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RO_TLS_DIR:-./.unconfigured-tls}
        target: /etc/router-orchestrator/tls
        read_only: true
        bind:
          create_host_path: false

  nginx:
    profiles: [standalone, external-stream]
    image: ${RO_NGINX_IMAGE:-router-orchestrator-nginx:unconfigured}
    pull_policy: never
    container_name: ${RO_STACK_NAME:-router-orchestrator}-nginx
    labels:
      org.router-orchestrator.stack-owner: "${RO_STACK_OWNER:-}"
      org.router-orchestrator.stack-revision: "${RO_STACK_REVISION:-}"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    volumes:
      - type: bind
        source: ${RO_NGINX_CONF:-./.unconfigured-nginx.conf}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RO_TLS_DIR:-./.unconfigured-tls}
        target: /etc/router-orchestrator/tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=4m
      - /tmp:rw,nosuid,nodev,size=8m
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:${RO_NGINX_HEALTH_PORT:-18189}/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
