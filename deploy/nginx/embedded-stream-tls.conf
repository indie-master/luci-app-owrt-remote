worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $upstream_proto { default $http_x_forwarded_proto; '' $scheme; }
  server {
    listen 127.0.0.1:18089;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # Preserve existing WSS reverse Xray clients; do not route this to HUB.
    location /owrt-ws/ {
      proxy_pass http://127.0.0.1:18444;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location / {
      proxy_pass http://127.0.0.1:8088;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $upstream_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
  server {
    listen 127.0.0.1:18445 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/router-orchestrator/tls/fullchain.pem;
    ssl_certificate_key /etc/router-orchestrator/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Preserve existing WSS reverse Xray clients; do not route this to HUB.
    location /owrt-ws/ {
      proxy_pass http://127.0.0.1:18444;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location / {
      proxy_pass http://127.0.0.1:8088;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $upstream_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
