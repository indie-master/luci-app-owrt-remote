name: router-orchestrator

services:
  hub:
    image: ${RO_HUB_IMAGE:?Set RO_HUB_IMAGE}
    container_name: router-orchestrator-hub
    network_mode: host
    restart: unless-stopped
    user: "23088:23088"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    environment:
      OWRT_REMOTE_STATE_DIR: /var/lib/owrt-remote
      OWRT_REMOTE_BIND: "127.0.0.1"
      OWRT_REMOTE_PORT: "${RO_PORT:-8088}"
      OWRT_REMOTE_PUBLIC_URL: "${RO_PUBLIC_URL:?Set RO_PUBLIC_URL}"
      OWRT_REMOTE_XRAY_CONTROL_BACKEND: host_adapter
      OWRT_REMOTE_HOST_ADAPTER_SOCKET: /run/router-orchestrator/control.sock
      OWRT_REMOTE_RUNTIME: docker
      OWRT_REMOTE_APP_NAME: "Router Orchestrator"
      OWRT_REMOTE_RESTART_XRAY_ON_WAN_RECONNECT: "0"
    volumes:
      - type: bind
        source: ${RO_STATE_DIR:?Set RO_STATE_DIR}
        target: /var/lib/owrt-remote
      - type: bind
        source: /run/router-orchestrator
        target: /run/router-orchestrator
        read_only: true
      - type: bind
        source: ${RO_TERMINAL_KEY_PATH:?Set RO_TERMINAL_KEY_PATH}
        target: /opt/owrt-remote/.host-terminal-key
        read_only: true
      - type: bind
        source: ${RO_TERMINAL_KNOWN_HOSTS:?Set RO_TERMINAL_KNOWN_HOSTS}
        target: /opt/owrt-remote/.host-terminal-known
        read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; p=os.environ['OWRT_REMOTE_PORT']; d=json.load(urllib.request.urlopen('http://127.0.0.1:'+p+'/health',timeout=3)); assert d.get('ok') is True"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  xray:
    image: ${RO_XRAY_IMAGE:?Set RO_XRAY_IMAGE}
    container_name: router-orchestrator-xray
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - type: bind
        source: ${RO_XRAY_CONFIG_DIR:-/etc/xray}
        target: /etc/xray
        read_only: true
      - type: bind
        source: ${RO_XRAY_ASSET_DIR:-/usr/local/share/xray}
        target: /usr/local/share/xray
        read_only: true
    command: ["run", "-config", "/etc/xray/owrt-remote.json"]

  nginx:
    image: ${RO_NGINX_IMAGE:-nginx:1.29-alpine}
    container_name: router-orchestrator-nginx
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: ${RO_NGINX_CONF:?Set RO_NGINX_CONF}
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${RO_TLS_DIR:?Set RO_TLS_DIR}
        target: /etc/router-orchestrator/tls
        read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=4m
      - /tmp:rw,nosuid,nodev,size=8m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:${RO_NGINX_HEALTH_PORT:-18089}/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
